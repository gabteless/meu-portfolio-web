<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista</title>
</head>
<body>
<h1>Listas</h1>

<div>
    <ol>Lista Ordenada
    <li>Café</li>
    <li>Chá</li>
    <li>Coca Cola</li>
    </ol>
</div>
<div>
    <ol type="I">Lista Ordeanda 2
    <li>Café</li>
    <li>Chá</li>
    <li>Coca Cola</li>
</ol>
</div>
<div>
    <ul type="circle">Lista Não Ordenada
    <li>Café</li>
    <li>Chá</li>
    <li>Coca Cola</li>
</ul>
</div>
<ul type="content">Lista Não Ordenada 2
<li>Café</li>
<li>Chá</li>
<li>Coca Cola</li>
</ul>

</body>
</html>
